---
master_if_external: eno1   # campus 172.16.0.0/16
master_if_mgmt: eno2       # 192.168.1.1/20
master_if_cluster: eno3    # 192.168.16.1/20

# Campus DNS servers - get these from the network administrator.
bind_forwarders: [CAMPUS_DNS_1, CAMPUS_DNS_2]

nfs_require_separate_data_fs: true
slurm_innodb_buffer_pool_size: 1G

# xCAT (roles/xcat). /install needs about 12 GB for the DVD.
xcat_iso_path: /srv/isos/AlmaLinux-9.8-x86_64-dvd.iso
# STOP GATE D: keep false until the osimage and nodes have been read.
xcat_enable_dhcp: false
# Power and boot order through the BMCs (c01.mgmt = 192.168.2.1, ...).
# Lets xCAT run: rpower c01 on|off|reset|stat, rsetboot c01 net, rcons c01.
xcat_use_ipmi: true
xcat_bmc_username: mhpc
xcat_bmc_password: "{{ vault_bmc_password }}"
