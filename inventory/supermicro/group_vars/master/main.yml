---
master_if_external: eno1   # campus 172.16.0.0/16
master_if_mgmt: eno2       # 192.168.1.1/20
master_if_cluster: eno3    # 192.168.16.1/20

# Campus DNS servers - get these from the network administrator.
bind_forwarders: [CAMPUS_DNS_1, CAMPUS_DNS_2]

nfs_require_separate_data_fs: true
slurm_innodb_buffer_pool_size: 1G

cobbler_iso_path: /srv/isos/AlmaLinux-9.8-x86_64-dvd.iso
cobbler_run_sync: false
