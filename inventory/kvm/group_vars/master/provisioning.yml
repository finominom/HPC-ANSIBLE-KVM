---
# Compute-node provisioning for the KVM rehearsal: the xcat role (install
# server) and the hpc_provisioning role (hpc-node controller).
# Values come from this inventory's other files (all.yml, compute.yml,
# host_vars/cNN.hpc.yml), so there is one place to change each of them.
# For the real cluster, copy this file to inventory/supermicro/group_vars/master/.

# ---------- Install media ----------
# The official Minimal ISO, copied to /data/isos (same file Cobbler used)
xcat_iso_path: /data/isos/AlmaLinux-9-latest-x86_64-minimal.iso
xcat_iso_sha256: "7762a4b45a66235726db145a573658964bf77bf7b9bc1c018afe86a4cf37cc2e"

# The Minimal ISO carries only a subset of BaseOS/AppStream. The installer
# also uses the master's full mirrors (/data/repos, served at /repos), so
# every package below is found and nodes start on the newest builds.
xcat_install_repos:
  - { name: Minimal, url: "http://{{ master_cluster_ip }}/install/{{ xcat_osver }}/{{ xcat_arch }}/Minimal" }
  - { name: hpc-baseos, url: "http://{{ master_cluster_ip }}/repos/baseos" }
  - { name: hpc-appstream, url: "http://{{ master_cluster_ip }}/repos/appstream" }
xcat_pkg_search_dirs:
  - "/install/{{ xcat_osver }}/{{ xcat_arch }}"
  - /data/repos/baseos
  - /data/repos/appstream

# Package set: @core installed cleanly from the Minimal ISO with Cobbler;
# perl, wget, rsync and tar are needed by xCAT's install scripts.
xcat_node_packages:
  - "@core"
  - chrony
  - curl
  - python3
  - tar
  - perl-interpreter
  - wget
  - rsync
  - bzip2
  - openssh-server
  - NetworkManager
  - nfs-utils
  - util-linux

# Disk layout that fits the lab node disks: /boot 1 GiB, swap, / fixed, /scratch = rest
xcat_root_mb: 12288
xcat_swap_mb: 2048

# ---------- Stop gate D and power ----------
# Keep false until the osimage and the node definitions have been read.
# Open it once with: master.yml --tags xcat -e xcat_enable_dhcp=true
xcat_enable_dhcp: true
# xCAT's own IPMI cannot reach VirtualBMC (one IP, many ports); hpc-node
# powers the VMs through the ipmi function below instead.
xcat_use_ipmi: false

# ---------- hpc-node (roles/hpc_provisioning) ----------
# VirtualBMC on the KVM host (lab/lab-node.sh): c01 -> 192.168.0.254:6231.
# VBMC password in vault.yml as vault_ipmi_password.
# Without VirtualBMC, run "hpc-node provision c02 --no-power" and start the VM yourself.
hpc_ipmi_set_bootdev: false     # VMs are PXE-first; xCAT answers install or boot-from-disk
hpc_ipmi_password: "{{ vault_ipmi_password | default('') }}"
hpc_ipmi_function: |
  ipmi() { local node=$1; shift; local n=$((10#${node#c})); ipmitool -I lanplus -H 192.168.0.254 -p $((6230+n)) -U mhpc -f /root/.ipmi-mhpc "$@"; }

# Checks a node must pass before it is READY (what compute.yml installs)
hpc_validate_packages: [openmpi, openmpi-devel, cmake, Lmod]
hpc_validate_users: []          # add accounts the service_accounts role creates
hpc_validate_hosts: ["master.{{ cluster_domain }}"]
hpc_validate_time_sync: true    # the master has a time source through NAT
