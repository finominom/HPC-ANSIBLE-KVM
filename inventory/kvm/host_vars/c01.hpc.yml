---
# Values for Slurm. Until c01 exists, these match the VM you plan to build
# (2 vCPU, 3 GB RAM). Once it is installed, replace with `slurmd -C` output
# (everything between "NodeName=c01" and "UpTime=").
slurm_node_params: "CPUs=2 Boards=1 SocketsPerBoard=2 CoresPerSocket=1 ThreadsPerCore=1 RealMemory=3400"

# MAC of the VM (virsh domiflist NAME), lower-case with colons.
# Cobbler creates the system record from this, and host-prep/compute-vms.yml
# gives the VM the same MAC.
cobbler_mac: "52:54:00:aa:bb:01"
