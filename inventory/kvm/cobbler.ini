# KVM/libvirt rehearsal cluster (master VM: alma98)
[master]
master.hpc ansible_connection=local

[compute]
# Listed now so slurm.conf and Cobbler know about them. master.yml never
# connects to them; compute.yml needs them installed and reachable.
c01.hpc
c02.hpc

# Hosts that run slurmd. For now the master runs jobs itself.
[slurm_nodes]
c01.hpc
c02.hpc
master.hpc
