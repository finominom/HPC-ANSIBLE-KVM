# KVM/libvirt rehearsal cluster (master VM: "master" in virsh)
[master]
master.hpc ansible_connection=local

[compute]
# Defined in xCAT from host_vars/cNN.hpc.yml (xcat_mac). compute.yml needs
# them installed and reachable.
c01.hpc
c02.hpc

# Hosts that run slurmd.
[slurm_nodes]
c01.hpc
c02.hpc
master.hpc

# Hosts Prometheus scrapes (node_exporter). A node not installed yet only
# shows as down; remove it here until it is.
[monitored]
master.hpc
c01.hpc
c02.hpc
