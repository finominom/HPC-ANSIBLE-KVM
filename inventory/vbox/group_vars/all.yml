---
# Cluster-wide settings - VirtualBox rehearsal
cluster_name: hpc
cluster_domain: hpc
mgmt_domain: mgmt
cluster_timezone: Africa/Lagos

cluster_net: 192.168.16.0/20
cluster_netmask: 255.255.240.0
mgmt_net: 192.168.0.0/20

master_cluster_ip: 192.168.16.1
master_mgmt_ip: 192.168.1.1

# How compute nodes get packages:
#   nat   = through the master to internet repos (runbook Option B)
#   local = only the master's xCAT copy of the media + local repo (Option A)
# nat is simplest in VirtualBox: Slurm comes straight from EPEL.
cluster_pkg_source: nat

# Every name DNS should know.
#   hpc  = OS address on the cluster network
#   mgmt = BMC address (for the master: its management NIC)
cluster_hosts:
  master: { hpc: 192.168.16.1, mgmt: 192.168.1.1 }
  c01: { hpc: 192.168.17.1, mgmt: 192.168.2.1 }
  c02: { hpc: 192.168.17.2, mgmt: 192.168.2.2 }

# OS media copied into xCAT with copycds: /install/<xcat_osver>/<xcat_arch>,
# stock osimage <xcat_osver>-<xcat_arch>-install-compute. Must match the ISO
# (the xcat role reads the version from the ISO and stops if it differs).
xcat_osver: alma9.8
xcat_arch: x86_64
