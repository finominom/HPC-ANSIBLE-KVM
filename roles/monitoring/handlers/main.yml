---
- name: Restart node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: restarted
    daemon_reload: true

# Prometheus and Alertmanager re-read their configuration on SIGHUP
- name: Reload prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: reloaded

- name: Reload alertmanager
  ansible.builtin.systemd:
    name: alertmanager
    state: reloaded

- name: Restart grafana
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted
