---
# The same key on every node. `copy` decrypts the vault file automatically.
- name: Install the cluster Munge key
  ansible.builtin.copy:
    src: "{{ slurm_munge_key_file }}"
    dest: /etc/munge/munge.key
    owner: munge
    group: munge
    mode: "0400"
  notify: Restart munge

- name: Start Munge
  ansible.builtin.systemd:
    name: munge
    state: started
    enabled: true

# Make sure a changed key is live before any Slurm daemon starts.
- name: Apply a changed Munge key now
  ansible.builtin.meta: flush_handlers

- name: Test Munge locally
  ansible.builtin.shell: |
    set -o pipefail
    munge -n | unmunge
  args:
    executable: /bin/bash
  changed_when: false
