---
cobbler_packages:
  - cobbler
  - dhcp-server
  - tftp-server
  - syslinux-nonlinux     # pxelinux.0 for legacy-BIOS PXE on EL9
  - syslinux-tftpboot
  - pykickstart
  - xorriso

cobbler_profile_name: "{{ cobbler_distro_name }}-{{ cobbler_arch }}"
cobbler_iso_path: /srv/isos/AlmaLinux-9.8-x86_64-dvd.iso
cobbler_iso_mount: /mnt/alma-dvd
cobbler_autoinstall_template: hpc-minimal.ks

# Addresses for machines Cobbler does not know (registered nodes get
# fixed addresses from their system records instead).
cobbler_dynamic_range: [192.168.30.1, 192.168.30.254]

# STOP GATE D: leave false until `cobbler check` is clean and the rendered
# Kickstart for c01 has been read. Then set true (or pass -e cobbler_run_sync=true).
cobbler_run_sync: false

cobbler_node_root_password_hash: "{{ vault_node_root_password_hash }}"

# Top-level keys changed in /etc/cobbler/settings.yaml (Cobbler 3.x)
cobbler_settings:
  server: "{{ master_cluster_ip }}"
  next_server_v4: "{{ master_cluster_ip }}"
  manage_dhcp: true
  manage_dhcp_v4: true
  manage_dns: false          # BIND is managed by the bind role
  pxe_just_once: true        # no reinstall loop after a node installs
  default_password_crypted: "{{ cobbler_node_root_password_hash }}"
