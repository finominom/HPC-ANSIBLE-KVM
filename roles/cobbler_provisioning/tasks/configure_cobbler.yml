---
# pxe_just_once makes the /cblr/svc/op/nopxe/system/<name> URL work: the kickstart
# calls it at the end of a successful install and Cobbler switches netboot off.
# run_install_triggers makes /cblr/svc/op/trig/... run triggers/install/{pre,post}/*.
- name: Cobbler settings for one-shot PXE and install triggers
  ansible.builtin.lineinfile:
    path: /etc/cobbler/settings.yaml
    regexp: "^{{ item.key }}:"
    line: "{{ item.key }}: {{ item.value }}"
  loop:
    - { key: pxe_just_once, value: "true" }
    - { key: run_install_triggers, value: "true" }
  notify: [Restart cobblerd, Cobbler sync]

- name: A root password hash was provided
  ansible.builtin.assert:
    that: hpc_root_password_hash is match('^\\$[56]\\$.{8,}')
    fail_msg: >-
      Set hpc_root_password_hash (output of: openssl passwd -6) in an Ansible vault.
      Otherwise nodes get Cobbler's shipped default root password.

- name: Cobbler default_password_crypted = the node root password hash
  ansible.builtin.lineinfile:
    path: /etc/cobbler/settings.yaml
    regexp: "^default_password_crypted:"
    line: "default_password_crypted: \"{{ hpc_root_password_hash }}\""
  no_log: true
  notify: [Restart cobblerd, Cobbler sync]

- name: Compute-node kickstart template
  ansible.builtin.template:
    src: hpc-compute.ks.j2
    dest: /var/lib/cobbler/templates/hpc-compute.ks
    mode: "0644"
  notify: Cobbler sync

- name: Install trigger directories
  ansible.builtin.file:
    path: "/var/lib/cobbler/triggers/install/{{ item }}"
    state: directory
    mode: "0755"
  loop: [pre, post]

- name: Install triggers (drop events into the queue)
  ansible.builtin.copy:
    src: 90_hpc-queue.sh
    dest: "/var/lib/cobbler/triggers/install/{{ item }}/90_hpc-queue.sh"
    mode: "0755"
  loop: [pre, post]

# cobblerd (cobblerd_t) may not execute files labelled cobbler_var_lib_t, so the triggers
# failed with "Permission denied" and no install event reached the queue. Label them bin_t.
- name: semanage is installed (SELinux file labels)
  ansible.builtin.dnf:
    name: policycoreutils-python-utils
    state: present
  when: ansible_facts.selinux.status | default('disabled') == 'enabled'

- name: SELinux label rule for the install triggers (bin_t, executable by cobblerd)
  ansible.builtin.shell: |
    R='/var/lib/cobbler/triggers/install/(pre|post)/90_hpc-queue\.sh'
    if semanage fcontext -l -C | grep -qF "$R"; then
      semanage fcontext -l -C | grep -F "$R" | grep -q ':bin_t:' && exit 0
      semanage fcontext -m -t bin_t "$R"
    else
      semanage fcontext -a -t bin_t "$R"
    fi
    echo CHANGED
  register: hpc_trig_fc
  changed_when: "'CHANGED' in hpc_trig_fc.stdout"
  when: ansible_facts.selinux.status | default('disabled') == 'enabled'

- name: SELinux labels on Cobbler paths
  ansible.builtin.command: restorecon -R /var/lib/cobbler/templates /var/lib/cobbler/triggers /var/lib/cobbler/hpc-queue
  changed_when: false

- name: The triggers carry the bin_t label
  ansible.builtin.shell: ls -Z /var/lib/cobbler/triggers/install/pre/90_hpc-queue.sh /var/lib/cobbler/triggers/install/post/90_hpc-queue.sh
  register: hpc_trig_label
  changed_when: false
  failed_when: hpc_trig_label.stdout_lines | select('search', ':bin_t:') | list | length != 2
  when: ansible_facts.selinux.status | default('disabled') == 'enabled'

- name: Make cobblerd pick up new settings before editing objects
  ansible.builtin.meta: flush_handlers

- name: Read the profile's kickstart
  ansible.builtin.command: "cobbler profile report --name={{ hpc_profile }}"
  register: hpc_profile_report
  changed_when: false

- name: Profile uses the compute kickstart
  ansible.builtin.command: >
    cobbler profile edit --name={{ hpc_profile }} --autoinstall=hpc-compute.ks
  when: hpc_profile_report.stdout is not search('(?m)^Automatic Installation Template\\s*:\\s*hpc-compute\\.ks\\s*$')
  changed_when: true
  notify: Cobbler sync

- name: Is each node registered in Cobbler?
  ansible.builtin.command: "cobbler system report --name={{ item.name }}"
  register: hpc_node_exists
  loop: "{{ hpc_nodes }}"
  loop_control: { label: "{{ item.name }}" }
  changed_when: false
  failed_when: false

- name: Register new nodes (netboot stays OFF until "hpc-node provision")
  ansible.builtin.command: >
    cobbler system add --name={{ item.item.name }} --profile={{ hpc_profile }}
    --hostname={{ item.item.name }}.{{ hpc_node_domain }} --interface={{ item.item.interface | default(hpc_cobbler_iface) }}
    --mac={{ item.item.mac }} --ip-address={{ item.item.ip }}
    --netmask={{ hpc_netmask }} {{ ('--gateway=' ~ hpc_master_ip) if hpc_nodes_use_master_gateway | bool else '' }} --netboot-enabled=false
  loop: "{{ hpc_node_exists.results }}"
  loop_control: { label: "{{ item.item.name }}" }
  when: item.rc != 0
  notify: Cobbler sync

- name: Keep already-registered nodes in line with hpc_nodes (netboot flag untouched)
  ansible.builtin.command: >
    cobbler system edit --name={{ item.item.name }} --profile={{ hpc_profile }}
    --hostname={{ item.item.name }}.{{ hpc_node_domain }} --interface={{ item.item.interface | default(hpc_cobbler_iface) }}
    --mac={{ item.item.mac }} --ip-address={{ item.item.ip }}
    --netmask={{ hpc_netmask }} {{ ('--gateway=' ~ hpc_master_ip) if hpc_nodes_use_master_gateway | bool else '' }}
  loop: "{{ hpc_node_exists.results }}"
  loop_control: { label: "{{ item.item.name }}" }
  when:
    - item.rc == 0
    - not (item.stdout is search('(?m)^MAC Address\\s*:\\s*' ~ (item.item.mac | regex_escape) ~ '\\s*$')
           and item.stdout is search('(?m)^IP Address\\s*:\\s*' ~ (item.item.ip | regex_escape) ~ '\\s*$')
           and item.stdout is search('(?m)^Interface =====\\s*:\\s*' ~ (item.item.interface | default(hpc_cobbler_iface) | regex_escape) ~ '\\s*$')
           and item.stdout is search('(?m)^Profile\\s*:\\s*' ~ (hpc_profile | regex_escape) ~ '\\s*$')
           and item.stdout is search('(?m)^Hostname\\s*:\\s*' ~ ((item.item.name ~ '.' ~ hpc_node_domain) | regex_escape) ~ '\\s*$'))
  changed_when: true
  notify: Cobbler sync

- name: List compute systems
  ansible.builtin.shell: "cobbler system list | tr -d ' ' | grep -E '{{ hpc_nodes_regex }}' || true"
  register: hpc_systems
  changed_when: false

- name: Every compute system uses the profile's kickstart (no per-node overrides)
  ansible.builtin.shell: |
    r=$(cobbler system report --name={{ item }})
    if echo "$r" | grep -Eq '^Profile\s*:\s*{{ hpc_profile }}\s*$' &&
       echo "$r" | grep -Eq '^Automatic Installation Template\s*:\s*<<inherit>>\s*$'; then
      exit 0
    fi
    cobbler system edit --name={{ item }} --profile={{ hpc_profile }} --autoinstall="<<inherit>>" && echo CHANGED
  register: hpc_inherit
  changed_when: "'CHANGED' in hpc_inherit.stdout"
  loop: "{{ hpc_systems.stdout_lines }}"
  notify: Cobbler sync
