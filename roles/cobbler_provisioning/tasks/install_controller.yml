---
- name: Packages the controller uses
  ansible.builtin.dnf:
    name: [ipmitool, curl, util-linux, openssh-clients]
    state: present

- name: State, log and queue directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ hpc_ansible_dir }}/provisioning/state/nodes"
    - "{{ hpc_ansible_dir }}/provisioning/logs"
    - /usr/local/lib/hpc-provision
    - /var/lib/cobbler/hpc-queue

- name: BMC password file for ipmitool -f
  ansible.builtin.copy:
    content: "{{ hpc_ipmi_password }}\n"
    dest: /root/.ipmi-mhpc
    mode: "0600"
  when: hpc_ipmi_password | length > 0
  no_log: true

- name: Configuration file
  ansible.builtin.template:
    src: hpc-provision.conf.j2
    dest: /etc/hpc-provision.conf
    mode: "0640"

- name: Shared shell library
  ansible.builtin.copy:
    src: hpc-provision-lib.sh
    dest: /usr/local/lib/hpc-provision/lib.sh
    mode: "0644"

- name: Commands
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    mode: "0755"
  loop: [hpc-node, hpc-node-configure, hpc-provision-dispatch]

- name: systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop: [hpc-provision.path, hpc-provision.service, "hpc-configure@.service"]
  notify: Reload systemd

- name: Validation playbook in the Ansible project
  ansible.builtin.template:
    src: validate-compute.yml.j2
    dest: "{{ hpc_ansible_dir }}/{{ hpc_validate_playbook }}"
    mode: "0644"

- name: Root SSH key the master uses to reach the nodes
  ansible.builtin.command: "ssh-keygen -t ed25519 -N '' -f {{ hpc_root_key }}"
  args:
    creates: "{{ hpc_root_key }}"

- name: Read the public key for the kickstart
  ansible.builtin.slurp:
    src: "{{ hpc_root_key }}.pub"
  register: hpc_pubkey_raw

- name: Remember the public key
  ansible.builtin.set_fact:
    hpc_root_pubkey: "{{ hpc_pubkey_raw.content | b64decode | trim }}"

- name: Watch for install events
  ansible.builtin.systemd:
    name: hpc-provision.path
    enabled: true
    state: started
    daemon_reload: true
