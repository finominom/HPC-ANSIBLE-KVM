---
# PXE services on the master: packages, Cobbler network settings, DHCP subnet, loaders,
# services, firewall. Everything here was done by hand in the lab; each task is idempotent.
# (Merged with the former network_boot.yml, which did the same job a second time.)

- name: Cobbler and PXE packages
  ansible.builtin.dnf:
    name: "{{ hpc_pxe_packages }}"
    state: present

- name: Cobbler network settings
  ansible.builtin.lineinfile:
    path: /etc/cobbler/settings.yaml
    regexp: "^{{ item.key }}:"
    line: "{{ item.key }}: {{ item.value }}"
  loop:
    - { key: server,          value: '"{{ hpc_master_ip }}"' }
    - { key: next_server_v4,  value: '"{{ hpc_master_ip }}"' }
    - { key: manage_dhcp,     value: "true" }
    - { key: manage_dhcp_v4,  value: "true" }
    - { key: manage_tftpd,    value: "true" }
    - { key: manage_dns,      value: "false" }    # BIND is managed by the bind role
  notify: [Restart cobblerd, Cobbler sync]

- name: SELinux lets httpd and Cobbler use the network
  ansible.posix.seboolean:
    name: "{{ item }}"
    state: true
    persistent: true
  loop: [httpd_can_network_connect_cobbler, cobbler_can_network_connect]
  when: ansible_facts.selinux.status | default('disabled') == 'enabled'

- name: Start cobblerd, httpd and TFTP
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [cobblerd, httpd, tftp.socket]

- name: Apply setting changes before touching loaders and templates
  ansible.builtin.meta: flush_handlers

- name: cobblerd answers
  ansible.builtin.command: cobbler version
  register: hpc_cv
  retries: 12
  delay: 5
  until: hpc_cv.rc == 0
  changed_when: false

- name: Network boot loaders (pxelinux.0 and friends)
  ansible.builtin.command: cobbler mkloaders
  args:
    creates: /var/lib/cobbler/loaders/pxelinux.0
  notify: Cobbler sync

- name: Count subnet blocks in dhcp.template
  ansible.builtin.command: grep -c '^subnet ' /etc/cobbler/dhcp.template
  register: hpc_subnets
  changed_when: false
  failed_when: false

- name: dhcp.template has exactly one subnet block
  ansible.builtin.assert:
    that: hpc_subnets.stdout == '1'
    fail_msg: "Expected one 'subnet' block in /etc/cobbler/dhcp.template, found {{ hpc_subnets.stdout }}. Fix it by hand."
    quiet: true

# Replaces only the subnet block; the per-host #for loop below it is kept.
- name: DHCP subnet block in Cobbler's dhcp.template
  ansible.builtin.replace:
    path: /etc/cobbler/dhcp.template
    regexp: '(?sm)^subnet [^{]*\{.*?^\}\n'
    replace: |
      subnet {{ hpc_pxe_subnet }} netmask {{ hpc_pxe_netmask }} {
          option subnet-mask         {{ hpc_pxe_netmask }};
          option domain-name         "{{ hpc_pxe_domain }}";
          option domain-name-servers {{ hpc_master_ip }};
      {% if hpc_nodes_use_master_gateway | bool %}
          option routers             {{ hpc_master_ip }};
      {% endif %}
          range dynamic-bootp        {{ hpc_pxe_range_start }} {{ hpc_pxe_range_end }};
          default-lease-time         21600;
          max-lease-time             43200;
          next-server                $next_server_v4;
          filename                   "pxelinux.0";
      }
    backup: true
  notify: Cobbler sync

# Cobbler restarts dhcpd after every system edit and sync. Several in a row hit systemd's
# default start limit (5 in 10 s): "start-limit-hit" and "Cobbler trigger failed:
# sync_post_restart_services". Also listen only on the cluster NIC.
- name: dhcpd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/dhcpd.service.d
    state: directory
    mode: "0755"

- name: dhcpd drop-in (no start limit; cluster NIC only)
  ansible.builtin.copy:
    dest: /etc/systemd/system/dhcpd.service.d/hpc.conf
    mode: "0644"
    content: |
      # managed by Ansible (cobbler_provisioning)
      [Unit]
      StartLimitIntervalSec=0
      {% if hpc_pxe_interface | length > 0 %}
      [Service]
      Environment=DHCPDARGS={{ hpc_pxe_interface }}
      {% endif %}
  register: hpc_dhcpd_dropin

- name: Make systemd read the drop-in and clear an earlier start-limit failure
  ansible.builtin.shell: systemctl daemon-reload && systemctl reset-failed dhcpd || true
  when: hpc_dhcpd_dropin is changed

# dhcpd is (re)started by cobbler sync once dhcpd.conf exists
- name: DHCP service enabled
  ansible.builtin.systemd:
    name: dhcpd
    enabled: true

- name: Is firewalld running?
  ansible.builtin.command: firewall-cmd --state
  register: hpc_fw_state
  changed_when: false
  failed_when: false

- name: Zone of the cluster NIC
  ansible.builtin.command: "firewall-cmd --get-zone-of-interface={{ hpc_pxe_interface }}"
  register: hpc_fw_zone
  changed_when: false
  failed_when: false
  when: hpc_fw_state.rc == 0 and hpc_pxe_interface | length > 0

- name: Firewall services for PXE (in that zone)
  ansible.builtin.shell: |
    Z="{{ ('--zone=' ~ hpc_fw_zone.stdout) if (hpc_fw_zone.rc | default(1)) == 0 else '' }}"
    firewall-cmd --permanent $Z --query-service={{ item }} >/dev/null || {
      firewall-cmd --permanent $Z --add-service={{ item }} && echo CHANGED; }
  register: hpc_fw
  changed_when: "'CHANGED' in hpc_fw.stdout"
  loop: "{{ hpc_pxe_firewall_services }}"
  when: hpc_fw_state.rc == 0
  notify: Reload firewall

- name: Node names resolve on the master (ssh by name even without DNS)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '\s{{ item.name }}\.{{ hpc_node_domain }}(\s|$)'
    line: "{{ item.ip }} {{ item.name }}.{{ hpc_node_domain }} {{ item.name }}"
  loop: "{{ hpc_nodes }}"
  loop_control: { label: "{{ item.name }}" }
  when: hpc_manage_master_hosts | bool
