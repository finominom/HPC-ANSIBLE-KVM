---
# One task file per job; each is idempotent. (network_boot.yml and register_nodes.yml
# were removed: they repeated install_pxe.yml and configure_cobbler.yml.)
- name: Build the node list from the inventory (one source of truth)
  ansible.builtin.set_fact:
    hpc_nodes: "{{ lookup('ansible.builtin.template', 'hpc-nodes.yml.j2') | from_yaml | default([], true) }}"
  when: hpc_nodes_from_inventory | bool
  tags: [always]

- name: Show the nodes Cobbler will know about
  ansible.builtin.debug:
    msg: "{{ hpc_nodes | map(attribute='name') | list }}"
  tags: [always]

- name: Install the provisioning controller (scripts, units, config)
  ansible.builtin.import_tasks: install_controller.yml

- name: PXE services (packages, Cobbler network settings, DHCP subnet, loaders, firewall)
  ansible.builtin.import_tasks: install_pxe.yml
  tags: [pxe]

- name: Install media (ISO -> Cobbler distro + profile; reuses an existing distro)
  ansible.builtin.import_tasks: install_media.yml
  tags: [media]

- name: Configure Cobbler (settings, kickstart, triggers, profile, node records)
  ansible.builtin.import_tasks: configure_cobbler.yml

- name: Flush handlers before validating
  ansible.builtin.meta: flush_handlers

- name: Validate the Cobbler side
  ansible.builtin.import_tasks: validate.yml
